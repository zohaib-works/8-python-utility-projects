{% extends 'layouts/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Image Resizer</h3>
        </div>
        <div class="card-body"> 
            <form action="{{ url_for('resize') }}" class="row" method="POST" enctype="multipart/form-data">
                <div class="form-group mb-3 col-md-12">
                    <label for="image">Image</label>    
                    <input type="file" name="image" id="image" class="form-control" required>
                </div>
                <div class="form-group mb-3 col-md-6">
                    <label for="width">Width(px)</label>
                    <input type="number" name="width" id="width" class="form-control" required>
                </div>
                <div class="form-group mb-3 col-md-6">    
                    <label for="height">Height(px)</label>  
                    <input type="number" name="height" id="height" class="form-control" required>
                </div>
                <div class="form-group mb-3 col-md-12">    
                    <label for="quality">Quality (1-100)</label>  
                    <input type="number" name="quality" id="quality" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Resize</button>
            </form>
        </div>  
        
    </div>
</div>

{% endblock %}
