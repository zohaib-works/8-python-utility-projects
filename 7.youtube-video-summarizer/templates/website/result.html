{% extends 'layouts/base.html' %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <h1 class="text-center">Video Summarizer</h1>
            <p class="text-center">Summarize any YouTube video in seconds</p>
            <div class="card mt-3">
                <div class="card-body">
                    <h5 class="card-title">Summary</h5>
                    <p class="card-text">{{ summary }}</p>
                </div>
            </div>

            <details>
                <summary>Full Transcript</summary>
                <pre class="mt-3 bg-white p-3 rounded" style="white-space: pre-wrap;">{{ full }}</pre>
            </details>
            <a href="/" class="btn btn-primary mt-3"> Summerize Another</a>
        </div>
    </div>
{% endblock %}
