{% extends 'layouts/base.html' %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <h1 class="text-center">Video Summarizer</h1>
            <p class="text-center">Summarize any YouTube video in seconds</p>

            <form action="/" method="POST">
                <div class="mb-3">
                    <label for="yt_url" class="form-label">YouTube URL</label>
                    <input type="text" class="form-control" id="yt_url" name="yt_url" required>
                </div>
                <button type="submit" class="btn btn-primary">Summarize</button>
            </form>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger mt-3">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}
        </div>
    </div>
{% endblock %}
