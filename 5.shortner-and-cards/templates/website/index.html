{% extends 'layouts/base.html' %}

{% block content %}
    <div class="row">
        <div class="col-md-12 mt-5">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Shorten your URL</h3>
            </div>
            <div class="card-body">
                <form method="POST" >
                    <input type="text" name="long_url" class="form-control" placeholder="Enter your url">
                    <button type="submit" class="btn btn-primary mt-3">Shorten</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
